databaseChangeLog:
  - changeSet:
      id: 002-create-refresh-tokens-table
      author: ashkelyonok
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: refresh_tokens
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: token
                  type: varchar(512)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: expiration_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: credential_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_refresh_token_credential
                    references: credentials(id)
        - createIndex:
            indexName: idx_refresh_tokens_credential
            tableName: refresh_tokens
            columns:
              - column:
                  name: credential_id