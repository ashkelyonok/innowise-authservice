spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://${DB_HOST:auth-db}:5432/${POSTGRES_DB:auth_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

application:
  config:
    user-service-url: ${USER_SERVICE_URL:http://user-service:8081}