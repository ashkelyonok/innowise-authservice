version: '3.8'

services:
  auth-db:
    image: postgres:15-alpine
    container_name: auth-db
    ports:
      - "${DB_PORT}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - auth-network

volumes:
  auth_db_data:

networks:
  auth-network: